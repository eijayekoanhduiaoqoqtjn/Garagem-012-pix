<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>GARAGE 012 • Pix</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 15%, rgba(190,0,0,.28), transparent 34%),
    linear-gradient(145deg,#050505 0%,#111 55%,#050505 100%);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
}
body:before{
  content:"";
  position:fixed; inset:0;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 1px,transparent 1px 9px);
  pointer-events:none;
}
.card{
  position:relative;
  width:min(430px,100%);
  overflow:hidden;
  border:1px solid #2b2b2b;
  border-radius:24px;
  background:linear-gradient(180deg,#161616,#090909);
  box-shadow:0 25px 70px rgba(0,0,0,.7),0 0 35px rgba(210,0,0,.12);
}
.top{
  padding:28px 24px 22px;
  text-align:center;
  background:linear-gradient(180deg,#151515,#0c0c0c);
  border-bottom:1px solid #252525;
}
.logo{
  display:inline-block;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-2px;
  font-size:40px;
  line-height:1;
  color:#e50909;
  text-shadow:2px 2px 0 #680000,0 0 18px rgba(229,9,9,.25);
}
.logo span{color:#fff}
.subtitle{
  margin-top:9px;
  font-size:11px;
  font-weight:800;
  letter-spacing:3px;
  color:#aaa;
}
.redline{
  height:4px;
  width:100%;
  background:linear-gradient(90deg,transparent,#e50909 20%,#ff2525 50%,#e50909 80%,transparent);
}
.content{padding:25px 22px 26px}
.label{
  color:#999;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:10px;
}
.key{
  width:100%;
  padding:17px 15px;
  border:1px solid #333;
  border-radius:13px;
  background:#050505;
  color:#fff;
  font-size:19px;
  font-weight:800;
  text-align:center;
  letter-spacing:.4px;
  word-break:break-all;
  box-shadow:inset 0 0 18px rgba(255,255,255,.025);
}
.copy{
  width:100%;
  margin-top:13px;
  padding:16px;
  border:0;
  border-radius:13px;
  background:linear-gradient(180deg,#f01818,#bd0000);
  color:white;
  font-size:16px;
  font-weight:1000;
  letter-spacing:.5px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(190,0,0,.28);
}
.copy:active{transform:scale(.985)}
.status{
  min-height:20px;
  margin-top:10px;
  text-align:center;
  color:#ff5252;
  font-size:13px;
  font-weight:800;
}
.info{
  margin-top:18px;
  padding:15px;
  border-radius:13px;
  border:1px solid #292929;
  background:#0d0d0d;
  color:#aaa;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}
.info b{color:#fff}
.footer{
  padding:14px;
  text-align:center;
  border-top:1px solid #222;
  color:#666;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.5px;
}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <div class="logo">GARAGE <span>012</span></div>
    <div class="subtitle">PAGAMENTO VIA PIX</div>
  </div>
  <div class="redline"></div>

  <section class="content">
    <div class="label">Chave Pix</div>
    <div class="key" id="pix">37.075.663/0001-85</div>
    <button class="copy" onclick="copiarPix()">COPIAR CHAVE PIX</button>
    <div class="status" id="status"></div>

    <div class="info">
      <b>Pagamento rápido e fácil</b><br>
      Copie a chave acima e abra o aplicativo do seu banco para realizar o pagamento.
    </div>
  </section>

  <div class="footer">GARAGE 012 • TAUBATÉ / SP</div>
</main>

<script>
async function copiarPix(){
  const chave = document.getElementById('pix').textContent.trim();
  const status = document.getElementById('status');

  // Tenta a API moderna de Clipboard primeiro.
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    try {
      await navigator.clipboard.writeText(chave);
      status.textContent = '✓ CHAVE PIX COPIADA!';
      return;
    } catch (e) {
      // Continua para o método compatível abaixo.
    }
  }

  // Fallback para arquivos HTML locais e navegadores que bloqueiam Clipboard API.
  const campo = document.createElement('textarea');
  campo.value = chave;
  campo.setAttribute('readonly', '');
  campo.style.position = 'fixed';
  campo.style.top = '0';
  campo.style.left = '0';
  campo.style.width = '1px';
  campo.style.height = '1px';
  campo.style.padding = '0';
  campo.style.border = '0';
  campo.style.opacity = '0';
  campo.style.pointerEvents = 'none';

  document.body.appendChild(campo);
  campo.focus();
  campo.select();
  campo.setSelectionRange(0, campo.value.length);

  let copiou = false;
  try {
    copiou = document.execCommand('copy');
  } catch (e) {
    copiou = false;
  }

  document.body.removeChild(campo);

  if (copiou) {
    status.textContent = '✓ CHAVE PIX COPIADA!';
  } else {
    status.textContent = 'Não foi possível copiar automaticamente. Pressione e segure a chave para copiar.';
  }
}
</script>
</body>
</html>
